<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Background gradient: deep orange -->
    <linearGradient id="bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7B40"/>
      <stop offset="100%" stop-color="#D94000"/>
    </linearGradient>
    <!-- Outer flame: gold to orange -->
    <linearGradient id="flameOuter" x1="80" y1="22" x2="80" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="45%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <!-- Inner flame: white glow -->
    <linearGradient id="flameInner" x1="80" y1="50" x2="80" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="160" height="160" rx="36" fill="url(#bg)"/>

  <!-- Subtle inner shadow ring -->
  <rect x="1" y="1" width="158" height="158" rx="35" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Outer flame body -->
  <path d="
    M 80 138
    C 55 126 42 104 46 82
    C 49 66 58 56 63 48
    C 61 57 66 62 70 59
    C 72 57 71 45 76 36
    C 77 32 80 29 80 29
    C 83 33 85 38 84 44
    C 87 38 92 40 93 48
    C 97 42 99 47 99 54
    C 102 48 104 52 104 58
    C 106 66 104 78 100 88
    C 96 100 106 96 108 84
    C 112 96 110 110 102 120
    C 98 126 90 134 80 138 Z
  " fill="url(#flameOuter)" filter="url(#glow)"/>

  <!-- Inner flame core (white glow) -->
  <path d="
    M 80 130
    C 63 120 57 103 60 88
    C 62 77 68 71 70 76
    C 70 70 74 67 77 70
    C 75 78 79 83 83 79
    C 87 75 88 82 88 90
    C 88 106 85 120 80 130 Z
  " fill="url(#flameInner)" opacity="0.7"/>

  <!-- Small spark dot top -->
  <circle cx="80" cy="26" r="3" fill="#FFE066" opacity="0.8"/>
</svg>
